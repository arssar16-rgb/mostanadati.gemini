<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مستنداتي | خزانة المستندات الشخصية</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مستنداتي">
  <meta name="theme-color" content="#070c18">
  
  <!-- خط IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* الوضع الليلي الكحلي الافتراضي */
    :root {
      --bg: #070c18;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --primary: #1e3a8a;
      --primary-active: #0284c7;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0b1329;
      --preview-bg: #060a12;
      --danger: #ef4444;
      --success: #10b981;
      --header-bg: rgba(15, 23, 42, 0.9);
    }

    /* الوضع النهاري */
    body.light-mode {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --primary: #0284c7;
      --primary-active: #0369a1;
      --accent: #0284c7;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --preview-bg: #f1f5f9;
      --danger: #ef4444;
      --success: #059669;
      --header-bg: rgba(255, 255, 255, 0.9);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 40px;
    }

    /* الشريط العلوي */
    header {
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1e3a8a, #0284c7);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    .brand-icon svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 6px 10px;
      border-radius: 20px;
      color: var(--success);
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: var(--success);
      border-radius: 50%;
    }

    /* الحاوية الرئيسية */
    main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .hero-text {
      text-align: center;
      margin-top: 4px;
    }

    .hero-text h1 {
      font-size: 1.55rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .hero-text p {
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    /* مربع البحث */
    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      padding: 15px 48px 15px 18px;
      border-radius: 14px;
      font-size: 1rem;
      color: var(--text-main);
      outline: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      stroke: var(--text-muted);
    }

    /* شريط التصنيفات */
    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .category-btn.active {
      background: var(--primary);
      border-color: var(--accent);
      color: #ffffff;
    }

    /* بطاقات الإحصاءات */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 14px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* قائمة المستندات */
    .documents-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .doc-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    .doc-item:hover {
      border-color: var(--accent);
    }

    .doc-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      overflow: hidden;
    }

    .doc-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(30, 58, 138, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .doc-icon svg {
      width: 20px;
      height: 20px;
      stroke: var(--accent);
    }

    .doc-details {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
    }

    .doc-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .doc-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      gap: 10px;
    }

    .preview-badge {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
    }

    /* نافذة المعاينة المباشرة */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 800px;
      height: 86vh;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.6rem;
      line-height: 1;
    }

    .modal-body {
      flex: 1;
      background: var(--preview-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 600px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      </div>
      <div class="brand-title">مستنداتي</div>
    </div>
    <div class="header-actions">
      <button class="theme-toggle-btn" id="themeToggleBtn">
        <span id="themeIcon">☀️</span>
        <span id="themeText">النهاري</span>
      </button>
      <div class="header-status">
        <div class="status-dot"></div>
        <span>متصل</span>
      </div>
    </div>
  </header>

  <main>
    <div class="hero-text">
      <h1>خزانة مستنداتك الشخصية</h1>
      <p>استعراض ومعاينة مباشرة لملفاتك في Google Drive</p>
    </div>

    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="ابحث بالاسم، أو الرقم، أو المجلد...">
    </div>

    <div class="categories-bar">
      <button class="category-btn active" data-folder="all">الكل</button>
      <button class="category-btn" data-folder="02 - شخصي">02 - شخصي</button>
      <button class="category-btn" data-folder="01 - العمل">01 - العمل</button>
      <button class="category-btn" data-folder="08-عقارات">08-عقارات</button>
      <button class="category-btn" data-folder="مقالات وبحوث">مقالات وبحوث</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">المستندات</span>
        <span class="stat-value" id="totalCount">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">المجلدات</span>
        <span class="stat-value">4 مجلدات</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">حالة التخزين</span>
        <span class="stat-value" style="color: var(--success); font-size: 0.95rem;">آمن في Drive</span>
      </div>
    </div>

    <div class="documents-list" id="docsList"></div>
  </main>

  <div class="modal-overlay" id="previewModal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="previewTitle">معاينة المستند</div>
        <button class="close-btn" id="closePreviewBtn">&times;</button>
      </div>
      <div class="modal-body" id="previewContainer"></div>
    </div>
  </div>

  <script>
    let documents = [
      {
        id: '1',
        title: 'الهوية الوطنية',
        folder: '02 - شخصي',
        date: '2026-09-28',
        url: 'https://drive.google.com/file/d/1GlmTx0RLnrfvuPjJ8YaXQDT-6CMh00q_/preview'
      },
      {
        id: '2',
        title: 'جواز السفر _2031',
        folder: '02 - شخصي',
        date: '2026-09-30',
        url: 'https://drive.google.com/file/d/1g5h1C_0Bv17iew06clOVS8aL_SSdj9Bt/preview'
      },
      {
        id: '3',
        title: 'بطاقات وأرقام الحسابات البنكية (الآيبان)',
        folder: '02 - شخصي',
        date: '2026-09-28',
        url: 'https://drive.google.com/file/d/1KYS9u9WNMUh-Rqba6Vy5UNcQ2CBtVQy_/preview'
      },
      {
        id: '4',
        title: 'محضر إحالة التسوية الودية (قضية استحقاق درجة)',
        folder: '02 - شخصي',
        date: '2026-11-08',
        url: 'https://drive.google.com/file/d/14oPhyn1TLT3ZunOzX7iXwF0b4rlWcTqZ/preview'
      },
      {
        id: '5',
        title: 'بيان خدمة وظيفية 2026',
        folder: '02 - شخصي',
        date: '2026-11-04',
        url: 'https://drive.google.com/file/d/1C2PRElvsthFpDRUJIQ3ietozfY8sQwWi/preview'
      },
      {
        id: '6',
        title: 'شهادة ترخيص مكافحة العدوى (بكسل BICSL)',
        folder: '02 - شخصي',
        date: '2026-09-23',
        url: 'https://drive.google.com/file/d/1WDAVVVtfBABCLJqQxZqiopjiJlTEpE-C/preview'
      },
      {
        id: '7',
        title: 'قرار التعيين المعتمد',
        folder: '01 - العمل',
        date: '2026-09-30',
        url: 'https://drive.google.com/file/d/1evzh8eIVqr9Ie8TouFBLGodIQtiPQfhB/preview'
      },
      {
        id: '8',
        title: 'إقرار صرف بدل العمل في المستشفيات النفسية 2026',
        folder: '01 - العمل',
        date: '2026-10-04',
        url: 'https://drive.google.com/file/d/1yW84NAmQqjFKOdlLmUTVKJdu2FPEHFe6/preview'
      },
      {
        id: '9',
        title: 'وثيقة تأمين المسؤولية المهنية الطبية (3 سنوات)',
        folder: '01 - العمل',
        date: '2026-10-27',
        url: 'https://drive.google.com/file/d/15a9VV8-hh7bPqO7khu-uiLUWK-rEyfSb/preview'
      },
      {
        id: '10',
        title: 'سجل متابعة طلبات التأمين الطبي (الشيت السحابي)',
        folder: '01 - العمل',
        date: '2026-11-06',
        url: 'https://docs.google.com/spreadsheets/d/135L6yG_lk5HPj77mZbUqv3-oZNWWd4T5N6yR6hX3Wk0/htmlembed'
      },
      {
        id: '11',
        title: 'السجل التجاري لمؤسسة روما الذهبية',
        folder: '08-عقارات',
        date: '2026-10-19',
        url: 'https://drive.google.com/file/d/1TMiGcd00zCQJStrDMXUSvv8piGfC2KNE/preview'
      },
      {
        id: '12',
        title: 'كشف حساب جاري - مؤسسة روما الذهبية للغسيل',
        folder: '08-عقارات',
        date: '2026-11-01',
        url: 'https://drive.google.com/file/d/1Rh1q_LN_ruK3UbSmHWw_zJc9uCC6rAmj/preview'
      },
      {
        id: '13',
        title: 'رخصة إنشاء موقع شوران',
        folder: '08-عقارات',
        date: '2026-10-19',
        url: 'https://drive.google.com/file/d/1FN2n3FIfQhIHn52GuBd-Kn2s8y_IBuHK/preview'
      },
      {
        id: '14',
        title: 'نموذج اللوحة الإرشادية المعتمدة - منصة بلدي',
        folder: '08-عقارات',
        date: '2026-10-25',
        url: 'https://drive.google.com/file/d/1m-GjKjduA4jXAj-sfqRugt1XPIpvhS6y/preview'
      },
      {
        id: '15',
        title: 'لوحة متابعة أسعار الشقق والفرص العقارية (جدة والمدينة)',
        folder: '08-عقارات',
        date: '2026-11-07',
        url: 'https://docs.google.com/spreadsheets/d/19lEW-bKY-mnjmxq61BM-WJdrK_YNEPAHhwLcYYMt0b8/htmlembed'
      },
      {
        id: '16',
        title: 'التقرير الاستراتيجي الشامل - الملف اليمني وعاصفة الحزم',
        folder: 'مقالات وبحوث',
        date: '2026-10-14',
        url: 'https://drive.google.com/file/d/1-gewbTkk1oSItRI_MtFGyAbn9Bwrsavh/preview'
      },
      {
        id: '17',
        title: 'بيان تكاليف دراسة الماجستير في مصر',
        folder: 'مقالات وبحوث',
        date: '2026-10-25',
        url: 'https://drive.google.com/file/d/1KbBrCOc3hKOLHLJ8OGS_NYlABAG9fhbu/preview'
      }
    ];

    let currentFilter = 'all';
    let searchQuery = '';

    const docsList = document.getElementById('docsList');
    const totalCountEl = document.getElementById('totalCount');
    const searchInput = document.getElementById('searchInput');
    const categoryBtns = document.querySelectorAll('.category-btn');

    const previewModal = document.getElementById('previewModal');
    const previewTitle = document.getElementById('previewTitle');
    const previewContainer = document.getElementById('previewContainer');
    const closePreviewBtn = document.getElementById('closePreviewBtn');

    // زر التبديل بين النهاري والليلي
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');

    function applyTheme(isLight) {
      if (isLight) {
        document.body.classList.add('light-mode');
        themeIcon.textContent = '🌙';
        themeText.textContent = 'الليلي';
        localStorage.setItem('mostanadati-theme', 'light');
      } else {
        document.body.classList.remove('light-mode');
        themeIcon.textContent = '☀️';
        themeText.textContent = 'النهاري';
        localStorage.setItem('mostanadati-theme', 'dark');
      }
    }

    // استعادة الثيم المحفوظ
    const savedTheme = localStorage.getItem('mostanadati-theme');
    if (savedTheme === 'light') {
      applyTheme(true);
    }

    themeToggleBtn.addEventListener('click', () => {
      const isCurrentlyLight = document.body.classList.contains('light-mode');
      applyTheme(!isCurrentlyLight);
    });

    // رسم القائمة
    function renderDocuments() {
      docsList.innerHTML = '';

      const filtered = documents.filter(doc => {
        const matchesFolder = (currentFilter === 'all') || (doc.folder === currentFilter);
        const matchesSearch = doc.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              doc.folder.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesFolder && matchesSearch;
      });

      totalCountEl.textContent = filtered.length;

      if (filtered.length === 0) {
        docsList.innerHTML = `
          <div style="text-align: center; padding: 40px; color: var(--text-muted);">
            لا توجد مستندات مطابقة
          </div>
        `;
        return;
      }

      filtered.forEach(doc => {
        const item = document.createElement('div');
        item.className = 'doc-item';
        item.onclick = () => openPreview(doc.id);
        item.innerHTML = `
          <div class="doc-info">
            <div class="doc-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
            </div>
            <div class="doc-details">
              <div class="doc-title">${doc.title}</div>
              <div class="doc-meta">
                <span>📁 ${doc.folder}</span>
                <span>📅 ${doc.date}</span>
              </div>
            </div>
          </div>
          <div class="preview-badge">معاينة</div>
        `;
        docsList.appendChild(item);
      });
    }

    window.openPreview = function(id) {
      const doc = documents.find(d => d.id === id);
      if (!doc) return;

      previewTitle.textContent = doc.title;
      previewContainer.innerHTML = `<iframe src="${doc.url}"></iframe>`;
      previewModal.classList.add('active');
    };

    closePreviewBtn.addEventListener('click', () => {
      previewModal.classList.remove('active');
      previewContainer.innerHTML = '';
    });

    categoryBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        categoryBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.folder;
        renderDocuments();
      });
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderDocuments();
    });

    renderDocuments();
  </script>
</body>
</html>
