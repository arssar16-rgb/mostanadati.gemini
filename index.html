<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مستنداتي | أرشفة المستندات الذكية</title>
  
  <!-- إعدادات تطبيق الويب PWA للآيفون والماك -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مستنداتي">
  <meta name="theme-color" content="#0b1329">
  
  <!-- خط IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070c18;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --primary: #1e3a8a;
      --primary-hover: #1d4ed8;
      --accent: #38bdf8;
      --accent-gold: #d97706;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 90px;
    }

    /* الشريط العلوي */
    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1e3a8a, #0284c7);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
    }

    .brand-icon svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 6px 12px;
      border-radius: 20px;
      color: #34d399;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    /* الحاوية الرئيسية */
    main {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* العبارة التعريفية */
    .hero-text {
      text-align: center;
      margin-bottom: 4px;
    }

    .hero-text h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(to left, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-text p {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    /* مربع البحث الكبير */
    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid #334155;
      padding: 16px 52px 16px 20px;
      border-radius: 16px;
      font-size: 1.05rem;
      color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .search-icon {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      stroke: var(--text-muted);
    }

    /* شريط التصنيفات */
    .categories-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .category-btn.active {
      background: var(--primary);
      border-color: var(--accent);
      color: #ffffff;
    }

    /* بطاقات الإحصاءات */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 14px 16px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffffff;
    }

    /* قائمة المستندات */
    .documents-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .doc-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .doc-item:hover {
      border-color: #334155;
      background: #131d36;
    }

    .doc-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .doc-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: rgba(30, 58, 138, 0.4);
      border: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .doc-icon svg {
      width: 22px;
      height: 22px;
      stroke: var(--accent);
    }

    .doc-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .doc-title {
      font-size: 0.98rem;
      font-weight: 600;
      color: #ffffff;
    }

    .doc-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
    }

    .doc-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      background: transparent;
      border: none;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }

    /* الزر العائم لإضافة مستند (FAB) */
    .fab {
      position: fixed;
      bottom: 24px;
      left: 24px;
      background: linear-gradient(135deg, #1e3a8a, #0284c7);
      color: #ffffff;
      border: none;
      padding: 14px 24px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4);
      cursor: pointer;
      z-index: 40;
      transition: transform 0.2s;
    }

    .fab:active {
      transform: scale(0.96);
    }

    /* نافذة المعاينة المدمجة (Preview Modal) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 720px;
      height: 82vh;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.5rem;
      padding: 4px;
    }

    .modal-body {
      flex: 1;
      background: #060a12;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
    }

    .modal-body iframe, .modal-body img {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
      object-fit: contain;
    }

    /* نافذة الإضافة */
    .upload-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .upload-modal.active {
      display: flex;
    }

    .upload-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .form-control {
      background: #060a12;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 14px;
      color: #ffffff;
      outline: none;
      font-size: 0.95rem;
    }

    .btn-submit {
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
    }

    @media (max-width: 640px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
      .brand-title {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <!-- شريط العنوان -->
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      </div>
      <div class="brand-title">مستنداتي</div>
    </div>
    <div class="header-status">
      <div class="status-dot"></div>
      <span>متصل بمجلدات Drive</span>
    </div>
  </header>

  <main>
    <!-- العبارة التعريفية -->
    <div class="hero-text">
      <h1>خزانة مستنداتك الشخصية</h1>
      <p>بحث فوري ومعاينة مباشرة من مجلداتك في Google Drive دون وسيط</p>
    </div>

    <!-- مربع البحث الكبير -->
    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="ابحث في المستندات، المعاملات، أو العقود...">
    </div>

    <!-- شريط التصنيفات (مجلداتك الحالية) -->
    <div class="categories-bar">
      <button class="category-btn active" data-folder="all">الكل</button>
      <button class="category-btn" data-folder="01 - العمل">01 - العمل</button>
      <button class="category-btn" data-folder="02 - شخصي">02 - شخصي</button>
      <button class="category-btn" data-folder="08-عقارات">08-عقارات</button>
      <button class="category-btn" data-folder="مقالات وبحوث">مقالات وبحوث</button>
    </div>

    <!-- بطاقات الإحصاءات -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">المستندات المفهرسة</span>
        <span class="stat-value" id="totalCount">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">المجلدات النشطة</span>
        <span class="stat-value">4 مجلدات</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">حالة الحفظ التلقائي</span>
        <span class="stat-value" style="color: var(--success); font-size: 1rem;">آمن محلياً</span>
      </div>
    </div>

    <!-- قائمة المستندات -->
    <div class="documents-list" id="docsList">
      <!-- يتم تعبئة المستندات برمجياً -->
    </div>
  </main>

  <!-- الزر العائم -->
  <button class="fab" id="addDocBtn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    <span>إضافة مستند جديد</span>
  </button>

  <!-- نافذة المعاينة المباشرة (داخل التطبيق دون الخروج منه) -->
  <div class="modal-overlay" id="previewModal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="previewTitle">معاينة المستند</div>
        <button class="close-btn" id="closePreviewBtn">&times;</button>
      </div>
      <div class="modal-body" id="previewContainer">
        <!-- يتم عرض محتوى الملف هنا -->
      </div>
    </div>
  </div>

  <!-- نافذة إضافة مستند جديد -->
  <div class="upload-modal" id="uploadModal">
    <div class="upload-box">
      <h3 style="font-size: 1.15rem; font-weight: 700;">إضافة مستند إلى مجلدات Drive</h3>
      
      <div class="form-group">
        <label>اسم المستند</label>
        <input type="text" id="docNameInput" class="form-control" placeholder="مثال: فاتورة صيانة، تقرير طبي...">
      </div>

      <div class="form-group">
        <label>المجلد الوجهة في Google Drive</label>
        <select id="docFolderSelect" class="form-control">
          <option value="01 - العمل">01 - العمل</option>
          <option value="02 - شخصي">02 - شخصي</option>
          <option value="08-عقارات">08-عقارات</option>
          <option value="مقالات وبحوث">مقالات وبحوث</option>
        </select>
      </div>

      <div class="form-group">
        <label>المستند (صورة أو PDF)</label>
        <input type="file" id="fileInput" class="form-control" accept="image/*,.pdf">
      </div>

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn-submit" id="saveDocBtn" style="flex: 1;">حفظ ومزامنة</button>
        <button class="btn-submit" id="cancelUploadBtn" style="background: transparent; border: 1px solid var(--card-border); color: var(--text-muted); flex: 1;">إلغاء</button>
      </div>
    </div>
  </div>

  <script>
    // قاعدة البيانات المحلية المؤقتة للمستندات المتوافقة مع مجلداتك الحالية
    let documents = [
      {
        id: '1',
        title: 'دراسة قضية استحقاق درجة وظيفية',
        folder: '02 - شخصي',
        date: '2026-11-04',
        type: 'pdf',
        url: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf'
      },
      {
        id: '2',
        title: 'دليل أسعار التكويد الطبي والخدمات',
        folder: '01 - العمل',
        date: '2026-11-01',
        type: 'pdf',
        url: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf'
      },
      {
        id: '3',
        title: 'سجل متابعة طلبات التأمين الطبي',
        folder: '01 - العمل',
        date: '2026-11-01',
        type: 'pdf',
        url: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf'
      },
      {
        id: '4',
        title: 'عقد استثمار مغاسل روما الذهبية - شوران',
        folder: '08-عقارات',
        date: '2026-10-25',
        type: 'pdf',
        url: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf'
      }
    ];

    let currentFilter = 'all';
    let searchQuery = '';

    const docsList = document.getElementById('docsList');
    const totalCountEl = document.getElementById('totalCount');
    const searchInput = document.getElementById('searchInput');
    const categoryBtns = document.querySelectorAll('.category-btn');

    // نوافذ العرض
    const previewModal = document.getElementById('previewModal');
    const previewTitle = document.getElementById('previewTitle');
    const previewContainer = document.getElementById('previewContainer');
    const closePreviewBtn = document.getElementById('closePreviewBtn');

    // نوافذ الرفع
    const uploadModal = document.getElementById('uploadModal');
    const addDocBtn = document.getElementById('addDocBtn');
    const cancelUploadBtn = document.getElementById('cancelUploadBtn');
    const saveDocBtn = document.getElementById('saveDocBtn');

    // دالة الرسم والعرض
    function renderDocuments() {
      docsList.innerHTML = '';

      const filtered = documents.filter(doc => {
        const matchesFolder = (currentFilter === 'all') || (doc.folder === currentFilter);
        const matchesSearch = doc.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              doc.folder.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesFolder && matchesSearch;
      });

      totalCountEl.textContent = filtered.length;

      if (filtered.length === 0) {
        docsList.innerHTML = `
          <div style="text-align: center; padding: 40px; color: var(--text-muted);">
            لا توجد مستندات مطابقة للبحث
          </div>
        `;
        return;
      }

      filtered.forEach(doc => {
        const item = document.createElement('div');
        item.className = 'doc-item';
        item.innerHTML = `
          <div class="doc-info" onclick="openPreview('${doc.id}')">
            <div class="doc-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
            </div>
            <div class="doc-details">
              <div class="doc-title">${doc.title}</div>
              <div class="doc-meta">
                <span>📁 ${doc.folder}</span>
                <span>📅 ${doc.date}</span>
              </div>
            </div>
          </div>
          <div class="doc-actions">
            <button class="action-btn" title="إخفاء من القائمة المحلية فقط" onclick="hideDocument('${doc.id}', event)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        `;
        docsList.appendChild(item);
      });
    }

    // المعاينة المباشرة داخل الصفحة
    window.openPreview = function(id) {
      const doc = documents.find(d => d.id === id);
      if (!doc) return;

      previewTitle.textContent = doc.title;
      previewContainer.innerHTML = `<iframe src="${doc.url}"></iframe>`;
      previewModal.classList.add('active');
    };

    closePreviewBtn.addEventListener('click', () => {
      previewModal.classList.remove('active');
      previewContainer.innerHTML = '';
    });

    // الخيار الأول للحذف: الإخفاء محلياً دون المساس بـ Drive
    window.hideDocument = function(id, event) {
      event.stopPropagation();
      if (confirm('هل تريد إخفاء المستند من التطبيق؟ (سيبقى محفوظاً في Google Drive بأمان دون حذفه)')) {
        documents = documents.filter(d => d.id !== id);
        renderDocuments();
      }
    };

    // فلترة التصنيفات
    categoryBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        categoryBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.folder;
        renderDocuments();
      });
    });

    // البحث الفوري
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderDocuments();
    });

    // فتح وإغلاق نافذة الإضافة
    addDocBtn.addEventListener('click', () => uploadModal.classList.add('active'));
    cancelUploadBtn.addEventListener('click', () => uploadModal.classList.remove('active'));

    // حفظ المستند الجديد
    saveDocBtn.addEventListener('click', () => {
      const name = document.getElementById('docNameInput').value.trim();
      const folder = document.getElementById('docFolderSelect').value;
      const fileInput = document.getElementById('fileInput');

      if (!name) {
        alert('يرجى كتابة اسم المستند');
        return;
      }

      const newDoc = {
        id: Date.now().toString(),
        title: name,
        folder: folder,
        date: new Date().toISOString().split('T')[0],
        type: 'pdf',
        url: fileInput.files[0] ? URL.createObjectURL(fileInput.files[0]) : 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf'
      };

      documents.unshift(newDoc);
      renderDocuments();

      uploadModal.classList.remove('active');
      document.getElementById('docNameInput').value = '';
      fileInput.value = '';
      alert('تم حفظ المستند وإدراجه في قائمة المزامنة بنجاح.');
    });

    // التشغيل المبدئي
    renderDocuments();
  </script>
</body>
</html>
