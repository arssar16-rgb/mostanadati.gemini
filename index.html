<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مستنداتي">
  <meta name="theme-color" content="#070c18">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg: #070c18;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(30, 41, 59, 0.8);
      --primary: #1e3a8a;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(11, 19, 41, 0.85);
      --preview-bg: #060a12;
      --success: #10b981;
      --warning: #f59e0b;
      --header-bg: rgba(15, 23, 42, 0.85);
      --drawer-bg: #0b1329;
    }

    body.light-mode {
      --bg: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(226, 232, 240, 0.9);
      --primary: #0284c7;
      --accent: #0284c7;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: rgba(241, 245, 249, 0.9);
      --preview-bg: #e2e8f0;
      --success: #059669;
      --warning: #d97706;
      --header-bg: rgba(255, 255, 255, 0.85);
      --drawer-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 40px;
    }

    header {
      background: var(--header-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-trigger-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* القائمة المخفية الجانبية (Drawer) */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: -300px;
      width: 300px;
      height: 100vh;
      background: var(--drawer-bg);
      border-left: 1px solid var(--card-border);
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 20px;
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
      transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .drawer.active {
      right: 0;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
    }

    .drawer-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .drawer-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .drawer-menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .drawer-item {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 12px;
      text-align: right;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }

    .drawer-item:hover, .drawer-item.active {
      background: rgba(56, 189, 248, 0.1);
      border-color: rgba(56, 189, 248, 0.3);
      color: var(--accent);
    }

    /* الحاوية الرئيسية */
    main {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 30px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .hero-section {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .hero-section h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .hero-section p {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* مربع البحث المركزي البارز */
    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 680px;
      margin: 10px auto 0;
    }

    .search-input {
      width: 100%;
      background: var(--input-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      padding: 18px 56px 18px 24px;
      border-radius: 18px;
      font-size: 1.1rem;
      color: var(--text-main);
      outline: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      transition: all 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
    }

    .search-icon {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      stroke: var(--text-muted);
    }

    /* فلترة نوع الملف */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 7px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--accent);
      color: #ffffff;
    }

    /* قائمة المستندات */
    .documents-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .doc-item {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s, border-color 0.2s;
    }

    .doc-item:hover {
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
    }

    .doc-info {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
      overflow: hidden;
    }

    .doc-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(30, 58, 138, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .doc-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }

    .doc-title {
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .doc-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .badge-expiry {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .doc-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: var(--accent);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-action:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    .btn-copy {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-copy:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    /* نافذة المعاينة */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: var(--drawer-bg);
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 840px;
      height: 88vh;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.6rem;
      line-height: 1;
    }

    .modal-body {
      flex: 1;
      background: var(--preview-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

    const docsList = document.getElementById('docsList');
    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.filter-btn');

    const previewModal = document.getElementById('previewModal');
    const previewTitle = document.getElementById('previewTitle');
    const previewContainer = document.getElementById('previewContainer');
    const closePreviewBtn = document.getElementById('closePreviewBtn');

    // القائمة الجانبية
    const menuBtn = document.getElementById('menuBtn');
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const drawerClose = document.getElementById('drawerClose');
    const drawerItems = document.querySelectorAll('.drawer-item');

    function toggleDrawer(open) {
      if (open) {
        sideDrawer.classList.add('active');
        drawerOverlay.classList.add('active');
      } else {
        sideDrawer.classList.remove('active');
        drawerOverlay.classList.remove('active');
      }
    }

    menuBtn.addEventListener('click', () => toggleDrawer(true));
    drawerClose.addEventListener('click', () => toggleDrawer(false));
    drawerOverlay.addEventListener('click', () => toggleDrawer(false));

    drawerItems.forEach(item => {
      item.addEventListener('click', () => {
        drawerItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        currentFolder = item.dataset.folder;
        toggleDrawer(false);
        renderDocuments();
      });
    });

    // تحديث العدادات
    function updateCounters() {
      document.getElementById('countAll').textContent = documents.length;
      document.getElementById('countPersonal').textContent = documents.filter(d => d.folder === '02 - شخصي').length;
      document.getElementById('countWork').textContent = documents.filter(d => d.folder === '01 - العمل').length;
      document.getElementById('countRealestate').textContent = documents.filter(d => d.folder === '08-عقارات').length;
      document.getElementById('countArticles').textContent = documents.filter(d => d.folder === 'مقالات وبحوث').length;
    }

    // الثيم
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');

    function applyTheme(isLight) {
      if (isLight) {
        document.body.classList.add('light-mode');
        themeIcon.textContent = '🌙';
        themeText.textContent = 'الليلي';
        localStorage.setItem('mostanadati-theme', 'light');
      } else {
        document.body.classList.remove('light-mode');
        themeIcon.textContent = '☀️';
        themeText.textContent = 'النهاري';
        localStorage.setItem('mostanadati-theme', 'dark');
      }
    }

    if (localStorage.getItem('mostanadati-theme') === 'light') applyTheme(true);

    themeToggleBtn.addEventListener('click', () => {
      applyTheme(!document.body.classList.contains('light-mode'));
    });

    function renderDocuments() {
      docsList.innerHTML = '';

      const filtered = documents.filter(doc => {
        const matchesFolder = (currentFolder === 'all') || (doc.folder === currentFolder);
        const matchesType = (currentType === 'all') || (doc.type === currentType);
        const matchesSearch = doc.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              doc.folder.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesFolder && matchesType && matchesSearch;
      });

      if (filtered.length === 0) {
        docsList.innerHTML = `
          <div style="text-align: center; padding: 40px; color: var(--text-muted);">
            لا توجد مستندات مطابقة للبحث
          </div>
        `;
        return;
      }

      filtered.forEach(doc => {
        let typeBadge = doc.type.toUpperCase();
        if(doc.type === 'excel') typeBadge = 'XLS';
        if(doc.type === 'image') typeBadge = 'IMG';

        const item = document.createElement('div');
        item.className = 'doc-item';
        item.innerHTML = `
          <div class="doc-info" onclick="openPreview('${doc.id}')" style="cursor: pointer;">
            <div class="doc-icon">${typeBadge}</div>
            <div class="doc-details">
              <div class="doc-title">${doc.title}</div>
              <div class="doc-meta">
                <span>📁 ${doc.folder}</span>
                <span>📦 ${doc.size}</span>
                ${doc.expiry ? `<span class="badge-expiry">⚠️ ${doc.expiry}</span>` : ''}
              </div>
            </div>
          </div>
          <div class="doc-actions">
            ${doc.copyText ? `<button class="btn-copy" title="نسخ البيانات السريعة" onclick="copyText('${doc.copyText}')">📋</button>` : ''}
            <button class="btn-action" onclick="openPreview('${doc.id}')">معاينة</button>
            <a href="${doc.url.replace('/preview', '/view')}" target="_blank" class="btn-action" style="background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.3); color: var(--success);">مشاركة Drive</a>
          </div>
        `;
        docsList.appendChild(item);
      });
    }

    window.copyText = function(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('تم نسخ النص بنجاح: ' + text);
      });
    };

    window.openPreview = function(id) {
      const doc = documents.find(d => d.id === id);
      if (!doc) return;

      previewTitle.textContent = doc.title;
      previewContainer.innerHTML = `<iframe src="${doc.url}"></iframe>`;
      previewModal.classList.add('active');
    };

    closePreviewBtn.addEventListener('click', () => {
      previewModal.classList.remove('active');
      previewContainer.innerHTML = '';
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentType = btn.dataset.type;
        renderDocuments();
      });
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderDocuments();
    });

    updateCounters();
    renderDocuments();
  </script>
</body>
</html>
